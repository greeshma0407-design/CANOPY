services:
  # Backend Web Service on Render
  - type: web
    name: canopy-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python scripts/seed_emission_factors.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: canopy-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://canopy-vki6.onrender.com"
      - key: CORS_ORIGIN_REGEX
        value: '^https://.*\.onrender\.com$'
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: JWT_SECRET_KEY
        generateValue: true

  # Frontend Static Site on Render
  - type: web
    name: canopy-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://canopy-vki6.onrender.com
